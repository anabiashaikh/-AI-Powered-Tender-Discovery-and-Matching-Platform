version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tender-discovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tender_discovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - tender-network

  redis:
    image: redis:7-alpine
    container_name: tender-discovery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tender-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tender-discovery-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=tender_discovery
      - DATABASE_SYNCHRONIZE=false
      - DATABASE_LOGGING=true
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=noreply@yourdomain.com
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - SCRAPING_SCHEDULE=0 0 * * *
    depends_on:
      - postgres
      - redis
    networks:
      - tender-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tender-discovery-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - tender-network

volumes:
  postgres_data:
  redis_data:

networks:
  tender-network:
    driver: bridge
